name: Transfer verified consumer package

on:
  push:
    branches: [codex/rocketide-final-wp07]
    paths:
      - .github/workflows/transfer-consumer.yml
      - scripts/transfer-verified-package.ps1
      - scripts/transfer-consumer-objects.py
      - docs/wp07-2026-09-27/transfer/**

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve runtime from exact-source successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $run = gh api repos/RyanEid06/RocketIDE/actions/runs/36337059578 | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne 'f54a7b2cd72dabaa5a327b61685bf53bbe81d5d2') { throw 'Wrong source CI' }
          gh run download 36337059578 --repo RyanEid06/RocketIDE --name RocketIDE-win-x64 --dir transfer-stage
          if ($LASTEXITCODE -ne 0) { throw 'CI download failed' }
      - name: Reproduce exact verified ZIP
        shell: pwsh
        run: ./scripts/transfer-verified-package.ps1
      - name: Restore exact consumer Git objects and push separate branch
        shell: pwsh
        run: |
          python scripts/transfer-consumer-objects.py
          if ($LASTEXITCODE -ne 0) { throw 'Consumer object validation failed' }
          git push origin refs/heads/codex/rocketide-consumer-1.0.0:refs/heads/codex/rocketide-consumer-1.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Consumer push failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: exact-RocketIDE-1.0.0
          path: RocketIDE-win-x64-1.0.0.zip
          if-no-files-found: error
