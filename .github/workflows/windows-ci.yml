name: windows-ci

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify
        shell: powershell
        run: .\scripts\verify.ps1

      - name: Package portable release
        shell: powershell
        run: .\scripts\package.ps1 -Version ${{ github.sha }} -OutputRoot artifacts/package-win-x64

      - name: Upload portable verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: RocketIDE-win-x64
          path: artifacts/verify-win-x64/
          if-no-files-found: error

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: RocketIDE-portable-win-x64
          path: artifacts/package-win-x64/*
          if-no-files-found: error
