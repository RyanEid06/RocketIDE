name: windows-ci

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify
        shell: powershell
        run: .\scripts\verify.ps1

      - name: Upload portable verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketIDE-win-x64
          path: artifacts/verify-win-x64/
          if-no-files-found: error
